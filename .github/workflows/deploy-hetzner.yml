name: Deploy to Hetzner

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: projectbt-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/projectbt_deploy
          chmod 600 ~/.ssh/projectbt_deploy

          ssh-keyscan -H "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy on Hetzner
        shell: bash
        run: |
          ssh \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            -o ConnectTimeout=20 \
            -i ~/.ssh/projectbt_deploy \
            "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}" \
            'bash -se' << 'EOF'
              set -Eeuo pipefail

              trap '
                EXIT_CODE=$?
                echo
                echo "Deployment failed."
                echo "Line: ${LINENO}"
                echo "Command: ${BASH_COMMAND}"
                echo "Exit code: ${EXIT_CODE}"
                exit "${EXIT_CODE}"
              ' ERR

              cd /opt/apps/projectbt

              echo "========================================"
              echo "Updating parent repository"
              echo "========================================"

              git fetch --prune origin
              git reset --hard origin/main

              echo "========================================"
              echo "Updating submodules"
              echo "========================================"

              git submodule sync --recursive
              git submodule update --init --recursive --force

              echo "Parent commit:"
              git rev-parse HEAD

              echo "Submodule commits:"
              git submodule status

              echo "Available API migrations:"
              ls -la services/api/prisma/migrations

              echo "========================================"
              echo "Starting database"
              echo "========================================"

              docker compose up -d db

              echo "Waiting for database health..."

              DATABASE_HEALTHY=false

              for i in $(seq 1 60); do
                STATUS="$(
                  docker inspect \
                    -f '{{.State.Health.Status}}' \
                    projectbt-db-1 \
                    2>/dev/null || true
                )"

                if [ "$STATUS" = "healthy" ]; then
                  DATABASE_HEALTHY=true
                  echo "Database is healthy"
                  break
                fi

                echo "Waiting for database... attempt=$i status=${STATUS:-unknown}"
                sleep 2
              done

              if [ "$DATABASE_HEALTHY" != "true" ]; then
                echo "Database is not healthy after waiting"
                docker compose logs db --tail=100
                exit 1
              fi

              echo "========================================"
              echo "Creating database backup"
              echo "========================================"

              mkdir -p backups/postgresql

              BACKUP_FILE="backups/postgresql/projectbt_$(date +%Y%m%d_%H%M%S)_before_deploy.dump"
              BACKUP_EXIT_CODE=0

              if timeout \
                --signal=TERM \
                --kill-after=10s \
                120s \
                docker exec \
                projectbt-db-1 \
                sh -lc 'exec pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc' \
                > "$BACKUP_FILE" \
                </dev/null; then

                echo "Database backup command completed."
              else
                BACKUP_EXIT_CODE=$?
              fi

              if [ "$BACKUP_EXIT_CODE" -ne 0 ]; then
                echo "Database backup command failed with exit code: $BACKUP_EXIT_CODE"

                if [ "$BACKUP_EXIT_CODE" -eq 124 ]; then
                  echo "Database backup exceeded the 120-second timeout."
                fi

                rm -f "$BACKUP_FILE"
                exit "$BACKUP_EXIT_CODE"
              fi

              if [ ! -s "$BACKUP_FILE" ]; then
                echo "Database backup failed or the backup file is empty."
                rm -f "$BACKUP_FILE"
                exit 1
              fi

              echo "Database backup created successfully:"
              ls -lh "$BACKUP_FILE"

              echo "Removing old database backups..."

              find backups/postgresql \
                -maxdepth 1 \
                -type f \
                -name 'projectbt_*_before_deploy.dump' \
                -printf '%T@ %p\n' \
                | sort -nr \
                | tail -n +11 \
                | cut -d' ' -f2- \
                | xargs -r rm -f

              echo "========================================"
              echo "Building backend image"
              echo "========================================"

              docker compose build backend

              echo "========================================"
              echo "Applying Prisma migrations"
              echo "========================================"

              docker compose run --rm backend npx prisma migrate deploy

              echo "========================================"
              echo "Building frontend image"
              echo "========================================"

              docker compose build frontend

              echo "========================================"
              echo "Recreating application containers"
              echo "========================================"

              docker compose up -d --force-recreate backend frontend

              echo "Waiting for frontend..."

              FRONTEND_READY=false

              for i in $(seq 1 30); do
                if curl \
                  --fail \
                  --silent \
                  --show-error \
                  http://127.0.0.1:3001/ \
                  > /dev/null; then

                  FRONTEND_READY=true
                  echo "Frontend is responding"
                  break
                fi

                echo "Waiting for frontend... attempt=$i"
                sleep 2
              done

              if [ "$FRONTEND_READY" != "true" ]; then
                echo "Frontend did not become available"
                docker compose logs frontend --tail=100
                exit 1
              fi

              echo "Checking backend container..."

              BACKEND_RUNNING="$(
                docker inspect \
                  -f '{{.State.Running}}' \
                  projectbt-backend-1 \
                  2>/dev/null || true
              )"

              if [ "$BACKEND_RUNNING" != "true" ]; then
                echo "Backend container is not running"
                docker compose logs backend --tail=120
                exit 1
              fi

              echo "Backend container is running."

              echo "========================================"
              echo "Removing unused Docker images"
              echo "========================================"

              docker image prune -f

              echo "========================================"
              echo "Deployment status"
              echo "========================================"

              docker compose ps

              echo
              echo "Application container details:"

              docker inspect \
                -f '{{.Name}} | started={{.State.StartedAt}} | image={{.Image}}' \
                projectbt-backend-1 \
                projectbt-frontend-1

              echo
              echo "Deployment completed successfully."
          EOF